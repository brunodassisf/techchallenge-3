name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancela execuções antigas da mesma branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, type-check e build
    runs-on: ubuntu-latest
    env:
      # Necessário só para carregar o prisma.config.ts; nada se conecta ao banco aqui.
      DATABASE_URL: mongodb://localhost:27017/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npm run lint

      # next typegen gera os tipos globais do App Router (LayoutProps, PageProps...)
      # em .next/types; sem ele o tsc falha num checkout limpo.
      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Build de produção (Next.js)
        run: npm run build

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: quality
    env:
      # O Compose exige esta variável. Valor descartável, só para o smoke test.
      DEFAULT_TEACHER_PASSWORD: ci-somente-smoke-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Subir a stack completa (MongoDB + migrate/seed + app)
        run: docker compose up -d --build --wait --wait-timeout 300 app

      - name: Smoke test da aplicação
        run: |
          curl -fsS -o /dev/null -w "GET /          -> %{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "GET /api/post  -> %{http_code}\n" http://localhost:3000/api/post
          curl -fsS -o /dev/null -w "GET /api/author -> %{http_code}\n" http://localhost:3000/api/author

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
