services:
  mongodb:
    image: mongo:7
    container_name: techchallenge3-mongodb
    restart: unless-stopped
    # Prisma needs to run transactions against MongoDB, which requires the
    # server to be a replica set (even a single-node one). No auth here —
    # this is a local-only dev database (not exposed beyond localhost).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: techchallenge3
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb-init:
    image: mongo:7
    container_name: techchallenge3-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status();
            print("Replica set already initialized.");
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            print("Replica set initiated.");
          }
          // Aguarda a eleição do primário antes de liberar os próximos serviços.
          while (!db.hello().isWritablePrimary) { sleep(500); }
          print("Primary ready.");
        '

  # Sincroniza o schema do Prisma com o banco e cria o usuário admin.
  # Usa o estágio "builder" do Dockerfile (tem Prisma CLI e tsx) e encerra.
  migrate:
    build:
      context: .
      target: builder
    image: techchallenge3-builder
    container_name: techchallenge3-migrate
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      DATABASE_URL: mongodb://mongodb:27017/techchallenge3?replicaSet=rs0
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@techchallenge.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    command: ["sh", "-c", "npx prisma db push --skip-generate && npm run db:seed"]

  app:
    build:
      context: .
      target: runner
    image: techchallenge3-app
    container_name: techchallenge3-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mongodb://mongodb:27017/techchallenge3?replicaSet=rs0
      SESSION_SECRET: ${SESSION_SECRET:-troque-este-segredo-em-producao-por-uma-string-longa}
      DEFAULT_TEACHER_PASSWORD: ${DEFAULT_TEACHER_PASSWORD:?Defina DEFAULT_TEACHER_PASSWORD no .env}
      # O servidor chama as próprias rotas /api por HTTP dentro do container.
      INTERNAL_API_URL: http://localhost:3000
      # Sem HTTPS local: permite que o navegador aceite o cookie de sessão.
      COOKIE_SECURE: "false"

  mongo-express:
    image: mongo-express:1
    container_name: techchallenge3-mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

volumes:
  mongodb_data:
